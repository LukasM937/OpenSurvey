# Rate Limiting Zone definieren (in http {}-Block, außerhalb von server {})
# 10 MB Zone = ~160.000 IPs trackbar
limit_req_zone $binary_remote_addr zone=umfrage:10m rate=5r/m;

# In deinen server {}-Block:
location /api/survey {
    limit_except POST OPTIONS { deny all; }
    client_max_body_size 512k;

    # Defense in Depth: nginx-seitiges Rate Limiting zusätzlich zum App-Level.
    # burst=3 erlaubt kurze Spitzen, nodelay sendet sofort 429 statt zu warten.
    limit_req zone=umfrage burst=3 nodelay;
    limit_req_status 429;

    # Nur nginx darf X-Forwarded-For setzen – Client-Header überschreiben.
    # $remote_addr (nicht $proxy_add_x_forwarded_for!) – verhindert Header-Spoofing.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;

    proxy_pass         http://127.0.0.1:8742;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

location /health {
    # Nur localhost
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8742;
}

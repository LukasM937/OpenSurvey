<VirtualHost *:443>
    ServerAdmin admin@muehrke.de
    ServerName survey.muehrke.de
    RewriteEngine On
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # HSTS: tell browsers to use HTTPS for 2 years
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    <Location /api/survey>
        ProxyPass        http://127.0.0.1:8742/api/survey
        ProxyPassReverse http://127.0.0.1:8742/api/survey
        <LimitExcept POST OPTIONS>
            Require all denied
        </LimitExcept>
        LimitRequestBody 524288
    </Location>

    <Location /api/newsletter>
        ProxyPass        http://127.0.0.1:8742/api/newsletter
        ProxyPassReverse http://127.0.0.1:8742/api/newsletter
        <LimitExcept POST OPTIONS>
            Require all denied
        </LimitExcept>
        LimitRequestBody 4096
    </Location>

    <Location /health>
        ProxyPass        http://127.0.0.1:8742/health
        ProxyPassReverse http://127.0.0.1:8742/health
        Require ip 127.0.0.1 ::1
    </Location>

    # Public aggregated results page
    <Location /results>
        ProxyPass        http://127.0.0.1:8742/results
        ProxyPassReverse http://127.0.0.1:8742/results
    </Location>

    # Admin dashboard – localhost and Tailscale only (100.64.0.0/10)
    <Location /admin>
        ProxyPass        http://127.0.0.1:8742/admin
        ProxyPassReverse http://127.0.0.1:8742/admin
        Require ip 127.0.0.1 ::1 100.64.0.0/10
    </Location>

    SSLEngine on
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    TraceEnable off
    <Files ".ht*">
        Require all denied
    </Files>

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/muehrke.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/muehrke.de/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/survey.muehrke.de-error.log
    CustomLog ${APACHE_LOG_DIR}/survey.muehrke.de-access.log combined
</VirtualHost>
